# Alchemist's Profanity Censor — настройки. После правки: /apc reload

# Включена ли цензура.
enabled: true

# Как скрывать мат:
#   stars      — заменять буквы на **** (по одной звёздочке на букву)
#   obfuscated — «магический» текст (&k): символы мерцают
mode: stars

# Убирать плашку «Сообщение изменено сервером».
# true  — зацензуренное сообщение отправляется как системное (без подписи): плашки нет, но такие
#         сообщения нельзя пожаловаться через чат и их могут не увидеть плагины-мосты (Discord и т.п.).
# false — сообщение остаётся подписанным, но у клиента появляется плашка.
hide-modified-notice: true

# Сообщать ли игроку, что его сообщение зацензурировано.
warn-sender: false
warn-message: "&cНе ругайтесь в чате!"

# Свои запрещённые слова.
#   слово   — точное совпадение
#   слово*  — начинается с
#   *слово  — заканчивается на
#   *слово* — содержит
extra-words: []

# Слова, которые никогда не цензурируются (точное совпадение).
whitelist: []

# Игроки с правом profanitycensor.bypass (по умолчанию — никто) не цензурируются.
